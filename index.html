<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For my one true love ❤️</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1d1830;
            --accent: #ff477e;
            --accent-glow: rgba(255, 71, 126, 0.4);
            --text-main: #f3f0fc;
            --text-muted: #a39cb5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle background stars */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.2;
            z-index: 0;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            z-index: 1;
            margin: 0 auto; /* Centering layout fix */
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff477e, #ff85a2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
            border: 1px solid rgba(255, 71, 126, 0.2);
            transition: all 0.4s ease;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .envelope-icon {
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope-icon:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        .message-text {
            font-size: 1.3rem;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.6s ease forwards;
        }

        .btn {
            background: linear-gradient(135deg, #ff477e, #ff7096);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 126, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .timer-container {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: none;
        }

        .timer {
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--accent);
            margin-top: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Birthday, my beautiful amaranthine! 🎂</h1>
        <p class="subtitle">One reason I love you, unlocked every single day no matter the distance.</p>

        <div class="card" id="card">
            <div id="lock-state">
                <div class="envelope-icon" onclick="unlockMessage()">✉️</div>
                <button class="btn" onclick="unlockMessage()">Open Today's Reason</button>
            </div>
            
            <div class="message-text" id="message-text">
                <!-- Message injected by JS -->
            </div>
        </div>

        <div class="timer-container" id="timer-container">
            <div>Next reason unlocks in:</div>
            <div class="timer" id="countdown">00:00:00</div>
            <div id="reasons-left" style="margin-top: 15px; font-size: 0.85rem; opacity: 0.8;"></div>
        </div>
    </div>

    <script>
        // 🔴 1. PASTE YOUR 365 REASONS HERE
        const reasons = [
            "The way your eyes instantly crinkle up when you genuinely laugh out loud.",
            "How incredibly supportive you are, even when I'm stressing over the smallest things.",
            "Your amazing taste in cinematic movies that I love watching with you.",
            "That soft sleepy voice you get when we stay up way too late on discord.",
            "How fiercely passionate you get when talking about the things you love.",
            "The simple fact that you make across-the-globe distances feel completely conquerable.",
            "How you always remember the tiniest details I mentioned passingly weeks ago."
            "The way you try to search for me in bed."
            "How your hair looks beautifully wild and messy first thing in the morning."
            "Your nightly rituals of applying skincare before eep."
            "It always takes you a few minutes just to stare blankly at the wall or ceiling after waking up."
            "How your eyes light up whenever you see desserts on the menu."
            "The exact length of your hair and how it feels running through my fingers."
            "The way you always save the best bite of your meal for the very end."
            "Your constant habit of scrolling through any social media and sending them to me."
            "How your smile brightens up the room whenever you laugh."
            "Your cute habit of checking yourself before going out."
            "The way your hair catches the golden hour light in the late afternoon."
            "How you enable me to keep the hair you cut."
            "Your beautifully curated and highly specific music playlists that span different genres."
            "How you look so peaceful and small when you are deep asleep."
            "The way your pouts are so expressive but you give so little movements to make it."
            "Your intense love for eggs and okoy to the point that you started to use it as a currency."
            "The serious and attentive professionalism you use whenever your studying or having a meeting is always hot."
            "Your complete inability to walk past animals and pets on the street without petting them."
            "The soft and gentle texture of your hands when they hold mine."
            "The tiny and soft baby hairs at the nape of your neck when you put your hair up."
            "Your love for buying brand new stationary and using them all up."
            "The way you always accept my offer of giving you a bite of my food."
            "How your eyes seem to hold an entire galaxy of intelligence and kindness."
            "How you always manage to find the most unique indie music artist before anyone else? (Like hello?)."
            "The way that you type in all caps when you're expressing absolute joy or the fact that you find something cute."
            "Your habit of setting so much alarms to avoid sleeping over them."
            "The way you lock the fuck in when you're completely in the zone, doing the things you love."
            "The simple and profound truth that you are my favorite person in the whole wide world and have ever existed."
            "I mean you're like a damn cookbook, you know so much recipes and never afraid to try new recipes out."
            "How you always look completely elegant even when you are wearing sweatpants and a messy bun."
        ];

        // 🔴 2. SET YOUR START DATE HERE (Tomorrow's Date)
        // Format MUST be: YYYY, MM (Note: January is 0, February is 1... August is 7, December is 11), DD
        // For August 12, 2026, it looks like this:
        const startDate = new Date(2026, 7, 12); 

        const card = document.getElementById('card');
        const lockState = document.getElementById('lock-state');
        const messageText = document.getElementById('message-text');
        const timerContainer = document.getElementById('timer-container');
        const countdownElement = document.getElementById('countdown');
        const reasonsLeftElement = document.getElementById('reasons-left');

        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
        }

        // Calculates how many days have passed since your specific start date
        function getDaysSinceStart() {
            const now = new Date();
            const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startMidnight = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
            
            const diffTime = todayMidnight - startMidnight;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            return diffDays;
        }

        function unlockMessage() {
            const daysPassed = getDaysSinceStart();
            let reasonIndex = 0;

            if (daysPassed >= 0) {
                // Official countdown has started (Day 1, Day 2, etc.)
                // We add 1 so that tomorrow (August 12) loads reasons[1]
                reasonIndex = (daysPassed + 1) % reasons.length;
            } else {
                // 🔴 It's today (August 11) or earlier! Show the very first reason as a sneak peek.
                reasonIndex = 0;
            }

            localStorage.setItem('lastUnlockedDate', getTodayString());
            localStorage.setItem('currentReasonIndex', reasonIndex);

            displayMessage(reasonIndex);
        }

        function displayMessage(index) {
            lockState.style.display = 'none';
            messageText.innerText = `\"${reasons[index]}\"`;
            messageText.style.display = 'block';
            timerContainer.style.display = 'block';
            
            const daysPassed = getDaysSinceStart();
            const totalReasonsCount = reasons.length;
            
            let remainingCount = totalReasonsCount;

            if (daysPassed >= 0) {
                // Math for when the year is officially running
                remainingCount = totalReasonsCount - (daysPassed + 1);
            } else {
                // 🔴 Math for today's preview: It will show exactly how many total reasons are waiting for tomorrow
                remainingCount = totalReasonsCount - 1;
            }

            if (remainingCount <= 0) {
                reasonsLeftElement.innerText = "You've unlocked every reason in this collection! ❤️";
            } else {
                reasonsLeftElement.innerText = `${remainingCount} beautiful reasons left to discover.`;
            }

            startCountdown();
        }

        function startCountdown() {
            function updateTimer() {
                const now = new Date();
                const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
                const diff = tomorrow - now;

                if (diff <= 0) {
                    localStorage.removeItem('lastUnlockedDate');
                    localStorage.removeItem('currentReasonIndex');
                    location.reload();
                    return;
                }

                const hours = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                const seconds = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');

                countdownElement.innerText = `${hours}:${minutes}:${seconds}`;
            }
            
            updateTimer();
            setInterval(updateTimer, 1000);
        }

        checkStatus();
    </script>
</body>
</html>
