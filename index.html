            const now = new Date();

                msUntilNextDay = Math.abs(diffTime);
            } else {
                currentDayIndex = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                if (currentDayIndex >= 243) currentDayIndex = 242; 
                
                const nextDayTimestamp = launchDate.getTime() + ((currentDayIndex + 1) * 24 * 60 * 60 * 1000);
                msUntilNextDay = nextDayTimestamp - now.getTime();
            }

            document.getElementById("day-counter").innerText = `Day ${currentDayIndex + 1} / 243`;
            document.getElementById("daily-reason-display").innerText = reasons[currentDayIndex];

            const timerElement = document.getElementById("countdown-timer");
            if (diffTime >= (243 * 24 * 60 * 60 * 1000)) {
                timerElement.innerText = "All unlocked! ✨";
            } else {
                const hours = Math.floor((msUntilNextDay % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((msUntilNextDay % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((msUntilNextDay % (1000 * 60)) / 1000);
                timerElement.innerText = `${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
            }
        }
        setInterval(updateDailyReason, 1000);

        // --- 3. ROCKET PROPULSION LAUNCH ENGINE ---
        function launchRocket() {
            const envStage = document.getElementById('envelope-stage');
            const contentStage = document.getElementById('content-stage');

            envStage.style.transform = 'translateY(-200vh) scale(0.5)';
            envStage.style.opacity = '0';
            
            setTimeout(() => {
                envStage.style.display = 'none';
                contentStage.style.display = 'flex';
                updateDailyReason();
                setTimeout(() => {
                    contentStage.style.opacity = '1';
                }, 50);
            }, 800);
        }

        // --- 4. ADVANCED CELESTIAL BACKGROUND CANVAS RENDERING ENGINE ---
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let asteroids = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initializeSpaceObjects();
        }
        window.addEventListener('resize', resizeCanvas);

        function generateAsteroidVertices(radius, pointsCount) {
            let vertices = [];
            for (let i = 0; i < pointsCount; i++) {
                let angle = (i / pointsCount) * Math.PI * 2;
                let noise = 0.7 + Math.random() * 0.5; 
                vertices.push({
                    x: Math.cos(angle) * radius * noise,
                    y: Math.sin(angle) * radius * noise,
                    craterAngle: angle,
                    craterDepth: Math.random() * (radius * 0.3)
                });
            }
            return vertices;
        }

        function initializeSpaceObjects() {
            stars = [];
            asteroids = [];

            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: 0.05 + Math.random() * 0.15
                });
            }

            asteroids.push({
                x: canvas.width * 0.1, y: canvas.height * 0.3,
                radius: 45, angle: 0, rotSpeed: 0.003,
                driftY: 0, driftSpeed: 0.005,
                vertices: generateAsteroidVertices(45, 12),
                craters: [{r: 8, x: -10, y: -5}, {r: 5, x: 12, y: 15}, {r: 11, x: -5, y: 18}]
            });

            asteroids.push({
                x: canvas.width * 0.88, y: canvas.height * 0.7,
                radius: 60, angle: 1.2, rotSpeed: -0.002,
                driftY: 0, driftSpeed: 0.004,
                vertices: generateAsteroidVertices(60, 14),
                craters: [{r: 12, x: 10, y: -10}, {r: 7, x: -20, y: 10}, {r: 6, x: 5, y: 22}]
            });

            if(canvas.width > 768) {
                asteroids.push({
                    x: canvas.width * 0.15, y: canvas.height * 0.8,
                    radius: 25, angle: 3.4, rotSpeed: 0.005,
                    driftY: 0, driftSpeed: 0.007,
                    vertices: generateAsteroidVertices(25, 9),
                    craters: [{r: 4, x: 2, y: -4}, {r: 3, x: -8, y: 6}]
                });
            }
        }

        function drawAsteroid(ast) {
            ctx.save();
            let dynamicY = ast.y + Math.sin(ast.driftY) * 20;
            ctx.translate(ast.x, dynamicY);
            ctx.rotate(ast.angle);

            let rockGrad = ctx.createLinearGradient(-ast.radius, -ast.radius, ast.radius, ast.radius);
            rockGrad.addColorStop(0, '#5c5366');
            rockGrad.addColorStop(0.4, '#433b4d');
            rockGrad.addColorStop(1, '#1e1924');

            ctx.fillStyle = rockGrad;
            ctx.beginPath();
            ctx.moveTo(ast.vertices[0].x, ast.vertices[0].y);
            for (let i = 1; i < ast.vertices.length; i++) {
                ctx.lineTo(ast.vertices[i].x, ast.vertices[i].y);
            }
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ast.craters.forEach(crater => {
                ctx.beginPath();
                ctx.arc(crater.x, crater.y, crater.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(21, 16, 28, 0.6)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(crater.x, crater.y, crater.r, Math.PI * 1.2, Math.PI * 0.2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < stars.length; i++) {
                let s = stars[i];
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fill();

                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }

            asteroids.forEach(ast => {
                ast.angle += ast.rotSpeed;
                ast.driftY += ast.driftSpeed;
                drawAsteroid(ast);
            });

            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
