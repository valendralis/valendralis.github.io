        // --- 2. TIME ENGINE (1 REASON PER DAY CALCULATION) ---
        // Change this variable to your designated project Day 1 Launch date
        const launchDate = new Date("August 12, 2026 00:00:00");

        function updateDailyReason() {
            const now = new Date();
            
            // Calculate total time differences in milliseconds
            const diffTime = now - launchDate;
            
            let currentDayIndex = 0;
            let msUntilNextDay = 0;

            if (diffTime < 0) {
                // If it's before the official launch date, default show Day 1
                currentDayIndex = 0;
                msUntilNextDay = Math.abs(diffTime);
            } else {
                // Determine current day number (1-365) via mathematical step floors
                currentDayIndex = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                // Keep capping loop protection if tracking exceeds 365 indexing boundaries
                if (currentDayIndex >= 365) {
                    currentDayIndex = 364; 
                }
                
                // Compute remaining milestone time step to next exact 24hr loop window
                const nextDayTimestamp = launchDate.getTime() + ((currentDayIndex + 1) * 24 * 60 * 60 * 1000);
                msUntilNextDay = nextDayTimestamp - now.getTime();
            }

            // Render Content Values onto UI
            document.getElementById("day-counter").innerText = `Day ${currentDayIndex + 1} / 365`;
            document.getElementById("daily-reason-display").innerText = reasons[currentDayIndex];

            // Render Countdown UI String
            const timerElement = document.getElementById("countdown-timer");
            if (diffTime >= (365 * 24 * 60 * 60 * 1000)) {
                timerElement.innerText = "All unlocked! ✨";
            } else {
                const hours = Math.floor((msUntilNextDay % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((msUntilNextDay % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((msUntilNextDay % (1000 * 60)) / 1000);
                timerElement.innerText = `${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
            }
        }

        // Run the logic ticks once a second continuously
        setInterval(updateDailyReason, 1000);


        // --- 3. ENVELOPE INTERACTION INTERFACE FUNCTION ---
        function openEnvelope() {
            const envStage = document.getElementById('envelope-stage');
            const contentStage = document.getElementById('content-stage');

            envStage.style.opacity = '0';
            envStage.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                envStage.style.display = 'none';
                contentStage.style.display = 'flex';
                // Trigger dynamic execution update step to instantly avoid text flicker placeholders
                updateDailyReason();
                setTimeout(() => {
                    contentStage.style.opacity = '1';
                }, 50);
            }, 800);
        }


        // --- 4. CANVAS DRIFTING STARFIELD SCRIPT ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 120;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: 0.1 + Math.random() * 0.2
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < numStars; i++) {
                let s = stars[i];
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fill();

                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
