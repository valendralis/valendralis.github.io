        /* Cosmic Galaxy Backdrop */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0f0c20 0%, #070414 60%, #020108 100%);

            display: flex;
            justify-content: center;
            align-items: center;

        /* Combined Interactive Environment Canvas */

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Launch Pad / Rocket Stage */
        #envelope-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        .envelope-btn {
            background: rgba(124, 58, 237, 0.15);
            border: 2px dashed #c084fc;
            border-radius: 50%;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;

            font-size: 4rem;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.3), inset 0 0 20px rgba(147, 51, 234, 0.2);
            transition: all 0.4s ease;
            animation: rocketHover 3s ease-in-out infinite;
        }

        .envelope-btn:hover {
            transform: scale(1.15);
            border-style: solid;
            box-shadow: 0 0 50px rgba(192, 132, 252, 0.8), inset 0 0 25px rgba(192, 132, 252, 0.4);
        }

        @keyframes rocketHover {
            0%, 100% { transform: translateY(0); }

            color: #c084fc;

        @keyframes pulseText {
            0% { opacity: 0.4; }
            100% { opacity: 1; text-shadow: 0 0 18px #c084fc; }

            opacity: 0;
            flex-direction: column;

        // --- 2. CELESTIAL TIMELINE SYSTEM ---
        const launchDate = new Date("August 12, 2026 00:00:00");

        function updateDailyReason() {
            const now = new Date();
            const diffTime = now - launchDate;
            
            let currentDayIndex = 0;
            let msUntilNextDay = 0;

            if (diffTime < 0) {
                currentDayIndex = 0;
                msUntilNextDay = Math.abs(diffTime);
            } else {
                currentDayIndex = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                if (currentDayIndex >= 365) currentDayIndex = 364; 
                
                const nextDayTimestamp = launchDate.getTime() + ((currentDayIndex + 1) * 24 * 60 * 60 * 1000);
                msUntilNextDay = nextDayTimestamp - now.getTime();
            }

            document.getElementById("day-counter").innerText = `Day ${currentDayIndex + 1} / 365`;
            document.getElementById("daily-reason-display").innerText = reasons[currentDayIndex];

            const timerElement = document.getElementById("countdown-timer");
            if (diffTime >= (365 * 24 * 60 * 60 * 1000)) {
                timerElement.innerText = "All unlocked! ✨";
            } else {
                const hours = Math.floor((msUntilNextDay % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((msUntilNextDay % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((msUntilNextDay % (1000 * 60)) / 1000);
                timerElement.innerText = `${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
            }
        }
        setInterval(updateDailyReason, 1000);

            const envStage = document.getElementById('envelope-stage');
            const contentStage = document.getElementById('content-stage');

            envStage.style.opacity = '0';

                envStage.style.display = 'none';
                contentStage.style.display = 'flex';
                updateDailyReason();
                setTimeout(() => {
                    contentStage.style.opacity = '1';
                }, 50);
            }, 800);
        }

            initializeSpaceObjects();
        }
        window.addEventListener('resize', resizeCanvas);

        // Procedural generator mapping points out unique rocky edge paths
        function generateAsteroidVertices(radius, pointsCount) {
            let vertices = [];
            for (let i = 0; i < pointsCount; i++) {
                let angle = (i / pointsCount) * Math.PI * 2;
                // Add extreme irregular noise profiles to the outer edges
                let noise = 0.7 + Math.random() * 0.5; 
                vertices.push({
                    x: Math.cos(angle) * radius * noise,
                    y: Math.sin(angle) * radius * noise,
                    craterAngle: angle,
                    craterDepth: Math.random() * (radius * 0.3)
                });
            }
            return vertices;
        }

        function initializeSpaceObjects() {
            stars = [];
            asteroids = [];

            // Spawn standard drifting background starfield data
            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: 0.05 + Math.random() * 0.15
                });
            }

            // Spawn localized detailed structural textured asteroids
            // Left Large Asteroid
            asteroids.push({
                x: canvas.width * 0.1, y: canvas.height * 0.3,
                radius: 45, angle: 0, rotSpeed: 0.003,
                driftY: 0, driftSpeed: 0.005,
                vertices: generateAsteroidVertices(45, 12),
                craters: [{r: 8, x: -10, y: -5}, {r: 5, x: 12, y: 15}, {r: 11, x: -5, y: 18}]
            });

            // Right Giant Asteroid
            asteroids.push({
                x: canvas.width * 0.88, y: canvas.height * 0.7,
                radius: 60, angle: 1.2, rotSpeed: -0.002,
                driftY: 0, driftSpeed: 0.004,
                vertices: generateAsteroidVertices(60, 14),
                craters: [{r: 12, x: 10, y: -10}, {r: 7, x: -20, y: 10}, {r: 6, x: 5, y: 22}]
            });

            // Mobile protective hidden medium cluster item
            if(canvas.width > 768) {
                asteroids.push({
                    x: canvas.width * 0.15, y: canvas.height * 0.8,
                    radius: 25, angle: 3.4, rotSpeed: 0.005,
                    driftY: 0, driftSpeed: 0.007,
                    vertices: generateAsteroidVertices(25, 9),
                    craters: [{r: 4, x: 2, y: -4}, {r: 3, x: -8, y: 6}]
                });
            }
        }

        function drawAsteroid(ast) {
            ctx.save();
            // Apply floating dynamic transformations smoothly
            let dynamicY = ast.y + Math.sin(ast.driftY) * 20;
            ctx.translate(ast.x, dynamicY);
            ctx.rotate(ast.angle);

            // Create primary base shaded rock texture gradients
            let rockGrad = ctx.createLinearGradient(-ast.radius, -ast.radius, ast.radius, ast.radius);
            rockGrad.addColorStop(0, '#5c5366');
            rockGrad.addColorStop(0.4, '#433b4d');
            rockGrad.addColorStop(1, '#1e1924');

            ctx.fillStyle = rockGrad;
            ctx.beginPath();
            ctx.moveTo(ast.vertices[0].x, ast.vertices[0].y);
            for (let i = 1; i < ast.vertices.length; i++) {
                ctx.lineTo(ast.vertices[i].x, ast.vertices[i].y);
            }
            ctx.closePath();
            ctx.fill();

            // Render shadow ridges directly along outer lines
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw individual crater textural layers
            ast.craters.forEach(crater => {
                ctx.beginPath();
                ctx.arc(crater.x, crater.y, crater.r, 0, Math.PI * 2);
                // Dark interior shadows
                ctx.fillStyle = 'rgba(21, 16, 28, 0.6)';
                ctx.fill();

                // Highlighted crater ridges rim maps
                ctx.beginPath();
                ctx.arc(crater.x, crater.y, crater.r, Math.PI * 1.2, Math.PI * 0.2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Process Star Array updates
            for (let i = 0; i < stars.length; i++) {
                let s = stars[i];
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fill();

                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            }

            // Process Asteroid updates & render ticks
            asteroids.forEach(ast => {
                ast.angle += ast.rotSpeed;
                ast.driftY += ast.driftSpeed;
                drawAsteroid(ast);
            });

            requestAnimationFrame(animate);
        }

        // Initialize setup variables instantly
        resizeCanvas();
        animate();
    </script>
</body>
</html>
